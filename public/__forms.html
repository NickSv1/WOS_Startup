<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Knodle waitlist</title>
  </head>
  <body>
    <!-- Static HTML so Netlify can detect this form at deploy time. -->
    <form name="waitlist" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" netlify>
      <input type="hidden" name="form-name" value="waitlist" />
      <p hidden>
        <label>Don’t fill this out <input name="bot-field" /></label>
      </p>
      <label>Email <input type="email" name="email" /></label>
      <button type="submit">Send</button>
    </form>
  </body>
</html>
